version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: revora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: revora
      POSTGRES_PASSWORD: revora_dev_secret
      POSTGRES_DB: revora_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: revora_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Inngest Dev Server (local workflow engine)
  inngest:
    image: inngest/inngest:latest
    container_name: revora_inngest
    restart: unless-stopped
    ports:
      - "8288:8288"
    command: ["dev", "--no-discovery"]

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: revora_network
